    *, *::before, *::after { box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: #fff;
      background: #020617;
      font-family: system-ui, sans-serif;
    }
    .site-header {
      border-bottom: 1px solid rgb(255 255 255 / .1);
      background: #020617;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      max-width: 100rem;
      margin: auto;
      padding: .75rem clamp(1.25rem, 4vw, 2rem);
    }
    .brand-mark {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: .25rem;
      width: 3rem;
      height: 3rem;
      flex: none;
      border: 1px solid rgb(30 58 138 / .7);
      border-radius: .75rem;
      background: #041527;
      font: bold .9375rem / 1 Georgia, serif;
    }
    .brand-mark small { color: #cbd5e1; font: inherit; font-size: .5rem; }
    .brand-name { font: 600 1.25rem Georgia, serif; }
    main {
      display: grid;
      flex: 1;
      align-items: center;
      background:
        linear-gradient(90deg, #020617 4%, rgb(2 6 23 / .93) 35%, rgb(8 24 58 / .5) 100%),
        radial-gradient(ellipse at 30% 0%, rgb(37 99 235 / .35), transparent 65%),
        var(--beach) 64% center / cover;
    }
    .content {
      width: 100%;
      max-width: 100rem;
      margin-inline: auto;
      padding: clamp(3rem, 10vw, 8rem) clamp(1.25rem, 4vw, 2rem);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 6.5vw, 5rem);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -.045em;
    }
    .note {
      max-width: 30rem;
      margin: 1.25rem 0 0;
      color: #cbd5e1;
      font-size: clamp(1rem, 2.2vw, 1.125rem);
      line-height: 1.65;
    }
    @media (width <= 40rem) {
      main {
        align-items: end;
        background-image:
          linear-gradient(0deg, #020617 5%, rgb(2 6 23 / .9) 42%, rgb(8 24 58 / .48) 100%),
          var(--beach);
        background-position: center, 65% center;
        background-size: auto, cover;
      }
      .content { padding-bottom: max(3rem, calc(env(safe-area-inset-bottom) + 2rem)); }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">NG <small>&amp;Co.</small></span>
      <span class="brand-name">NG Advisory Co.</span>
    </div>
  </header>
  <main>
    <div class="content">
      <h1>Coming soon.</h1>
      <p class="note">We’re taking a short break. The site will be back soon.</p>
    </div>
  </main>
</body>
